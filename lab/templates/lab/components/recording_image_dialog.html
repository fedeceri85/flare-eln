<dialog class="recording-gallery" data-image-dialog aria-labelledby="recording-gallery-title">
    <div class="gallery-heading">
        <h2 id="recording-gallery-title">Recording images</h2>
        <button type="button" class="button" data-gallery-close autofocus aria-label="Close recording images">Close</button>
    </div>
    <p class="gallery-status" data-gallery-status role="status" aria-live="polite"></p>
    <div data-gallery-viewer hidden>
        <div class="gallery-stage" data-gallery-stage>
            <img data-gallery-image alt="" hidden>
        </div>
        <p class="gallery-image-name" data-gallery-image-name></p>
        <div class="gallery-controls">
            <button type="button" class="button" data-gallery-previous aria-label="Previous image">← Previous</button>
            <span data-gallery-position aria-live="polite"></span>
            <button type="button" class="button" data-gallery-next aria-label="Next image">Next →</button>
            <button type="button" class="button" data-gallery-zoom aria-pressed="false">Enlarge</button>
            <a class="button" data-gallery-download download>Download</a>
        </div>
    </div>
    <div data-gallery-management hidden>
        <form method="post" data-gallery-remove-form hidden>
            {% csrf_token %}
            <input type="hidden" name="image_id">
            <button class="button button-danger" type="submit" name="action" value="remove">Remove image</button>
        </form>
        <details class="gallery-upload" data-gallery-upload-details>
            <summary>Add images</summary>
            <form method="post" enctype="multipart/form-data" data-gallery-upload-form>
                {% csrf_token %}
                <label for="gallery-upload-input">Images</label>
                <input id="gallery-upload-input" type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple required>
                <small>JPEG, PNG or WebP. Up to 10 at a time, 20 MB each. Stored as compressed viewing copies.</small>
                <button class="button button-primary" type="submit" name="action" value="upload">Upload images</button>
            </form>
        </details>
    </div>
</dialog>
