<dialog class="recording-gallery" data-image-dialog aria-labelledby="recording-gallery-title">
    <div class="gallery-heading">
        <h2 id="recording-gallery-title">Recording attachments</h2>
        <button type="button" class="button" data-gallery-close autofocus aria-label="Close recording attachments">Close</button>
    </div>
    <div class="gallery-tabs" aria-label="Attachment type" data-gallery-tab-list>
        <button type="button" id="gallery-images-tab" aria-controls="gallery-images-panel" aria-selected="true" tabindex="0" data-gallery-tab-button="images">Images</button>
        <button type="button" id="gallery-documents-tab" aria-controls="gallery-documents-panel" aria-selected="false" tabindex="-1" data-gallery-tab-button="documents">Documents</button>
    </div>
    <p class="gallery-status" data-gallery-status role="status" aria-live="polite"></p>
    <section id="gallery-images-panel" aria-labelledby="gallery-images-tab" data-gallery-tab-panel="images">
        <div data-gallery-viewer hidden>
            <div class="gallery-stage" data-gallery-stage><img data-gallery-image alt="" hidden></div>
            <p class="gallery-image-name" data-gallery-image-name></p>
            <div class="gallery-controls">
                <button type="button" class="button" data-gallery-previous aria-label="Previous image">← Previous</button>
                <span data-gallery-position aria-live="polite"></span>
                <button type="button" class="button" data-gallery-next aria-label="Next image">Next →</button>
                <button type="button" class="button" data-gallery-zoom aria-pressed="false">Enlarge</button>
                <a class="button" data-gallery-download download>Download</a>
            </div>
        </div>
        <div data-gallery-management hidden>
            <form method="post" data-gallery-remove-form hidden>
                {% csrf_token %}<input type="hidden" name="image_id">
                <button class="button button-danger" type="submit" name="action" value="remove">Remove image</button>
            </form>
            <details class="gallery-upload" data-gallery-upload-details>
                <summary>Add images</summary>
                <form method="post" enctype="multipart/form-data" data-gallery-upload-form>
                    {% csrf_token %}<label for="gallery-upload-input">Images</label>
                    <input id="gallery-upload-input" type="file" name="images" accept="image/jpeg,image/png,image/webp,image/tiff,.tif,.tiff" multiple required>
                    <small>JPEG, PNG, WebP or TIFF. Up to 10 at a time, 20 MB each.</small>
                    <button class="button button-primary" type="submit" name="action" value="upload">Upload images</button>
                </form>
            </details>
        </div>
    </section>
    <section id="gallery-documents-panel" aria-labelledby="gallery-documents-tab" data-gallery-tab-panel="documents" hidden>
        <div class="gallery-documents" data-gallery-documents></div>
        <div data-gallery-document-management hidden>
            <details class="gallery-upload" data-gallery-document-upload-details>
                <summary>Add PDF documents</summary>
                <form method="post" enctype="multipart/form-data" data-gallery-document-upload-form>
                    {% csrf_token %}<label for="gallery-document-upload-input">PDF documents</label>
                    <input id="gallery-document-upload-input" type="file" name="documents" accept="application/pdf,.pdf" multiple required>
                    <small>PDF only. Up to 10 at a time, 10 MB each.</small>
                    <button class="button button-primary" type="submit" name="action" value="upload_documents">Upload documents</button>
                </form>
            </details>
        </div>
    </section>
</dialog>
