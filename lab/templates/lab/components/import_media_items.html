{% for image in shared_images %}
    <div class="media-item">
        {% if image.available %}<img width="100" height="72" style="object-fit:contain;max-width:100%" src="{% url 'lab:import_image_file' image.id %}" alt="{{ image.name }}" data-media-preview>{% endif %}
        <div><strong>{{ image.name }}</strong>{% if not image.available %}<p class="import-help">Currently unavailable; skipped unless restored before import.</p>{% endif %}</div>
        <button class="button button-danger" type="submit" form="import-media-remove" name="image_id" value="{{ image.id }}" data-media-remove>Remove</button>
    </div>
{% endfor %}
