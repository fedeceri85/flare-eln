{% for image in shared_images %}
    <div class="media-item">
        {% if image.available %}<img src="{% url 'lab:import_image_file' image.id %}" alt="{{ image.caption|default:image.name }}" data-media-preview>{% endif %}
        <div><strong>{{ image.name }}</strong>{% if image.caption %}<p>{{ image.caption }}</p>{% endif %}{% if not image.available %}<p class="import-help">Currently unavailable; skipped unless restored before import.</p>{% endif %}</div>
        <button class="button button-danger" type="submit" form="import-media-remove" name="image_id" value="{{ image.id }}" data-media-remove>Remove</button>
    </div>
{% endfor %}
