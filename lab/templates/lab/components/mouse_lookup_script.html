<script>
    (function () {
        const input = document.querySelector("[data-mouse-lookup-input]");
        const resultsList = document.querySelector("[data-mouse-lookup-results]");
        const status = document.querySelector("[data-mouse-lookup-status]");

        if (!input || !resultsList || !status) {
            return;
        }

        const lookupUrl = "{{ mouse_lookup_url }}";
        let requestController = null;
        let lookupTimer = null;

        function hideResults() {
            resultsList.classList.remove("visible");
            resultsList.textContent = "";
        }

        function setStatus(message) {
            status.textContent = message;
            status.classList.toggle("visible", Boolean(message));
        }

        function splitMouseIds(value) {
            return value
                .split(/[,;\r\n]+/)
                .map((mouseId) => mouseId.trim())
                .filter(Boolean);
        }

        function selectMouse(mouseId) {
            if (input.dataset.mouseLookupMultiple === "true") {
                const mouseIds = splitMouseIds(input.value);

                if (!mouseIds.includes(mouseId)) {
                    mouseIds.push(mouseId);
                }

                input.value = mouseIds.join("\n");
            } else {
                input.value = mouseId;
            }

            hideResults();
            setStatus("");
            input.focus();
        }

        function renderResults(results) {
            resultsList.textContent = "";

            results.forEach((mouse) => {
                const option = document.createElement("button");
                option.className = "autocomplete-option";
                option.type = "button";
                option.setAttribute("role", "option");
                option.dataset.mouseId = mouse.id;
                option.textContent = mouse.label;
                resultsList.appendChild(option);
            });

            resultsList.classList.toggle("visible", results.length > 0);
            setStatus(results.length ? "" : "No matching mice.");
        }

        function fetchResults() {
            const mouseIds = splitMouseIds(input.value);
            const query = mouseIds.length
                ? mouseIds[mouseIds.length - 1]
                : input.value.trim();

            if (!query) {
                hideResults();
                setStatus("");
                return;
            }

            if (requestController) {
                requestController.abort();
            }

            requestController = new AbortController();

            fetch(`${lookupUrl}?q=${encodeURIComponent(query)}`, {
                headers: {
                    "Accept": "application/json",
                },
                signal: requestController.signal,
            })
                .then((response) => response.json())
                .then((payload) => {
                    renderResults(payload.results || []);
                })
                .catch((error) => {
                    if (error.name !== "AbortError") {
                        hideResults();
                        setStatus("Mouse lookup is unavailable.");
                    }
                });
        }

        input.addEventListener("input", () => {
            clearTimeout(lookupTimer);
            lookupTimer = setTimeout(fetchResults, 150);
        });

        input.addEventListener("focus", () => {
            if (input.value.trim()) {
                fetchResults();
            }
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                hideResults();
                setStatus("");
            }
        });

        resultsList.addEventListener("mousedown", (event) => {
            const option = event.target.closest(".autocomplete-option");

            if (!option) {
                return;
            }

            event.preventDefault();
            selectMouse(option.dataset.mouseId);
        });

        document.addEventListener("click", (event) => {
            if (event.target === input || resultsList.contains(event.target)) {
                return;
            }

            hideResults();
        });
    }());
</script>
