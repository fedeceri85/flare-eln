<dialog class="parent-match-dialog" data-remove-parent-dialog aria-labelledby="remove-parent-title" aria-describedby="remove-parent-description">
    <h2 id="remove-parent-title">Remove parent?</h2>
    <p id="remove-parent-description" data-remove-parent-description></p>
    <p>The change will take effect when you save.</p>
    <div class="actions parent-match-actions">
        <button type="button" class="button" data-remove-parent-cancel autofocus>Cancel</button>
        <button type="button" class="button button-danger" data-remove-parent-confirm>Remove parent</button>
    </div>
</dialog>
