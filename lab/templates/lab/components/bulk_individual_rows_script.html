<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector("[data-bulk-individual-form]");
    if (!form) return;
    const rows = document.getElementById("bulk-individual-mouse-rows");
    const button = form.querySelector("[data-preview-individual-mice]");
    const status = form.querySelector("[data-bulk-rows-status]");
    const updateGenotype = form.elements.update_genotype;
    const sharedEdits = new Map();
    const individualEdits = new Map();
    let editNumber = 0;

    function fillGenotypeRows(field, replay) {
        if (!updateGenotype.checked || !field.value) return;
        const lineId = field.dataset.lineId;
        let edit = sharedEdits.get(lineId);
        if (!replay) {
            edit = {value: field.value, version: ++editNumber};
            sharedEdits.set(lineId, edit);
        }
        if (!edit || edit.value !== field.value) return;
        let count = 0;
        rows.querySelectorAll("[data-individual-genotype-field]").forEach(function (individual) {
            if (individual.dataset.lineId !== lineId) return;
            if (replay && (individualEdits.get(individual.name) || 0) > edit.version) return;
            individual.value = field.value;
            count++;
        });
        if (!replay && count) status.textContent = "Genotype copied to " + count + " mouse rows. Review the individual values before saving.";
    }
    function fillSharedGenotypes(replay) {
        form.querySelectorAll("[data-genotype-field]").forEach(function (field) {
            fillGenotypeRows(field, replay);
        });
    }
    form.addEventListener("change", function (event) {
        if (event.target === updateGenotype) {
            if (updateGenotype.checked) fillSharedGenotypes(false);
        } else if (event.target.matches("[data-genotype-field]")) {
            fillGenotypeRows(event.target, false);
        } else if (event.target.matches("[data-individual-genotype-field]")) {
            individualEdits.set(event.target.name, ++editNumber);
        }
    });

    let requestNumber = 0;
    let timer;
    let pending = false;
    let dirty = false;

    async function refreshRows() {
        const currentRequest = ++requestNumber;
        const data = new FormData(form);
        data.set("preview_individual_mice", "1");
        pending = true;
        dirty = false;
        status.textContent = "Updating mouse rows…";
        try {
            const response = await fetch(form.action || window.location.href, {
                method: "POST", body: data, headers: {"X-Requested-With": "XMLHttpRequest"},
            });
            if (!response.ok) throw new Error("Preview failed");
            const result = await response.json();
            if (currentRequest !== requestNumber) return;
            const live = new Map();
            rows.querySelectorAll("input, select").forEach(function (field) {
                live.set(field.name, field.type === "checkbox" ? field.checked : field.value);
            });
            rows.innerHTML = result.html;
            rows.querySelectorAll("input, select").forEach(function (field) {
                if (!live.has(field.name)) return;
                if (field.type === "checkbox") field.checked = live.get(field.name);
                else field.value = live.get(field.name);
            });
            fillSharedGenotypes(true);
            status.textContent = "Mouse rows updated. The displayed genotype values will be saved.";
        } catch (error) {
            if (currentRequest !== requestNumber) return;
            dirty = true;
            status.textContent = "Could not update the rows. Use Refresh mouse rows to try again.";
        } finally {
            if (currentRequest === requestNumber) pending = false;
        }
    }
    function scheduleRefresh() {
        dirty = true;
        clearTimeout(timer);
        requestNumber++;
        timer = setTimeout(refreshRows, 250);
    }
    ["update_crossing", "crossing_definition"].forEach(function (name) {
        form.elements[name].addEventListener("change", scheduleRefresh);
    });
    button.addEventListener("click", function (event) {
        if (dirty && status.textContent.startsWith("Could not")) return;
        event.preventDefault();
        clearTimeout(timer);
        refreshRows();
    });
    form.addEventListener("submit", function (event) {
        if (event.submitter === button || event.submitter?.hasAttribute("formaction")) return;
        if (pending || dirty) {
            event.preventDefault();
            status.textContent = "Refresh and review the mouse rows before saving.";
            if (!pending) refreshRows();
        }
    });
});
</script>
