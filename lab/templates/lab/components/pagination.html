{% if pagination %}
    <nav class="pagination" aria-label="Table pages">
        <div class="page-status">
            Page {{ pagination.number }} of {{ pagination.num_pages }}
        </div>

        <div class="pagination-links">
            {% if pagination.has_previous %}
                <a class="page-link" href="{{ pagination.first_url }}">First</a>
                <a class="page-link" href="{{ pagination.previous_url }}">
                    Previous
                </a>
            {% else %}
                <span class="page-link disabled">First</span>
                <span class="page-link disabled">Previous</span>
            {% endif %}

            {% if pagination.has_next %}
                <a class="page-link" href="{{ pagination.next_url }}">Next</a>
                <a class="page-link" href="{{ pagination.last_url }}">Last</a>
            {% else %}
                <span class="page-link disabled">Next</span>
                <span class="page-link disabled">Last</span>
            {% endif %}
        </div>
    </nav>
{% endif %}
