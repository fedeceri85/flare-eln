<div class="shared-mouse-details genotype-global-editor" data-genetics-editor>
    <p class="bulk-help" data-multiple-mice-only {% if form.single_mouse_mode %}hidden{% endif %}>Uncheck Select individually for a line to set its genotype for all animals. Shared results immediately update the rows below.</p>
    <div class="shared-genetics">
        <div class="bulk-field shared-crossing-column">
            {% include "lab/components/shared_mouse_input.html" with field=form.crossing_search %}
        </div>
        <div class="shared-genotype-column" data-multiple-mice-only {% if form.single_mouse_mode %}hidden{% endif %}>
            <div data-litter-shared-genotypes>{% include "lab/components/litter_shared_genotypes.html" %}</div>
            <p role="status" aria-live="polite" data-litter-genotype-status></p>
            <noscript><button class="button" type="submit" name="apply_shared_genotype" value="1" formnovalidate>Apply shared genotype to animal rows</button></noscript>
        </div>
    </div>
</div>
