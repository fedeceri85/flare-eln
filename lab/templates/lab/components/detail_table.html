<div class="table-card">
    <div class="table-scroll">
        <table class="info-table">
            <tbody>
                {% for row in details.rows %}
                    <tr>
                        <th scope="row">{{ row.label }}</th>
                        <td>{{ row.value }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
