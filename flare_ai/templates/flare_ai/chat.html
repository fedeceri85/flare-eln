{% load static %}
<section
    class="flare-ai-chat"
    data-flare-ai-chat
    data-stream-url="{% url 'flare_ai:chat_stream' %}"
    data-reset-url="{% url 'flare_ai:reset_chat' %}"
    data-assistant-name="{{ flare_ai_assistant_name }}"
>
    <button
        type="button"
        class="flare-ai-launcher"
        data-ai-launcher
        aria-controls="flare-ai-drawer"
        aria-expanded="false"
    >
        <span class="flare-ai-launcher-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 2.75c.35 4.8 2.45 6.9 7.25 7.25-4.8.35-6.9 2.45-7.25 7.25-.35-4.8-2.45-6.9-7.25-7.25 4.8-.35 6.9-2.45 7.25-7.25Z" />
                <path d="M19 15.75c.14 1.92.98 2.76 2.9 2.9-1.92.14-2.76.98-2.9 2.9-.14-1.92-.98-2.76-2.9-2.9 1.92-.14 2.76-.98 2.9-2.9Z" />
            </svg>
        </span>
        Ask {{ flare_ai_assistant_name }}
    </button>
    <aside
        id="flare-ai-drawer"
        class="flare-ai-drawer"
        data-ai-drawer
        aria-label="{{ flare_ai_assistant_name }} AI assistant"
        hidden
    >
        <header class="flare-ai-header">
            <div>
                <strong>{{ flare_ai_assistant_name }}</strong>
                <small>FLARE-AI</small>
            </div>
            <div class="flare-ai-header-actions">
                <button type="button" class="account-link" data-ai-reset>Reset</button>
                <button type="button" class="account-link" data-ai-close aria-label="Close assistant">Close</button>
            </div>
        </header>
        <ol class="flare-ai-messages" data-ai-messages aria-live="polite"></ol>
        <div class="flare-ai-suggestions" data-ai-suggestions hidden></div>
        <div class="flare-ai-status" data-ai-status role="status"></div>
        <form class="flare-ai-form" data-ai-form>
            {% csrf_token %}
            <div class="flare-ai-attachment-row">
                <button type="button" class="button flare-ai-attach" data-ai-attach>
                    <svg
                        class="flare-ai-attach-icon"
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                    Attach
                </button>
                <div class="flare-ai-attachment" data-ai-attachment hidden>
                    <span class="flare-ai-attachment-chip" data-ai-attachment-chip></span>
                    <button
                        type="button"
                        class="flare-ai-attachment-remove"
                        data-ai-remove-attachment
                        aria-label="Remove attached file"
                    >Remove</button>
                </div>
            </div>
            <label for="flare-ai-input" class="visually-hidden">Message {{ flare_ai_assistant_name }}</label>
            <textarea
                id="flare-ai-input"
                data-ai-input
                rows="3"
                maxlength="4000"
                placeholder="Ask about this page or your FLARE records"
                required
            ></textarea>
            <div class="flare-ai-form-actions">
                <button type="submit" class="button button-primary" data-ai-send>Send</button>
                <button type="button" class="button" data-ai-stop hidden>Stop</button>
                <button type="button" class="button flare-ai-retry" data-ai-retry hidden>Retry</button>
            </div>
            <p class="flare-ai-attachment-help" data-ai-attachment-help>Attach a CSV, XLSX, TXT, MD, image (PNG/JPG/WEBP) or PDF file (up to 10 MB).</p>
            <input
                type="file"
                data-ai-file-input
                accept=".csv,.xlsx,.txt,.md,.png,.jpg,.jpeg,.webp,.pdf"
                class="visually-hidden"
                tabindex="-1"
                aria-hidden="true"
            >
        </form>
    </aside>
</section>
<script src="{% static 'flare_ai/chat.js' %}?v=5" defer></script>
